# Monthly lock refresh: re-lock every dependency to the newest release allowed,
# and open a pull request when uv.lock changes. Dependabot's uv updates are
# lockfile-only and move only direct dependencies (dependabot-core#14073), so
# without this, indirect entries in uv.lock go stale and the `highest` test jobs
# test releases a new install would never get.
#
# Requires the repository setting "Allow GitHub Actions to create and approve
# pull requests". GitHub does not start CI for a pull request that a workflow
# opens with GITHUB_TOKEN, so close and reopen the pull request to run it.
name: Refresh uv.lock

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the first of each month
  workflow_dispatch:

permissions: {}

jobs:
  # This job runs `uv lock --upgrade`, which picks the newest allowed version of
  # every dependency and writes uv.lock. --no-build keeps uv from running any
  # package's build code, and as a second guard this job holds only read
  # access. The job that holds write access never runs uv, and only commits the
  # uv.lock this job uploads. Jobs run on separate runners, so nothing that runs
  # here can reach the write token. Steps within one job share a runner, so code
  # from an earlier step could reach a token scoped to a later one.
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The 7-day cooldown comes from [tool.uv] exclude-newer in pyproject.toml.
      - name: Re-lock every dependency
        run: uv lock --upgrade --no-build
      - name: Upload the lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uv-lock
          path: uv.lock

  pull-request:
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the lock
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: uv-lock
      - name: Open a pull request if the lock changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- uv.lock && exit 0
          gh auth setup-git
          branch="lock-refresh/$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Refresh uv.lock" -- uv.lock
          git push origin "$branch"
          gh pr create --head "$branch" --title "Refresh uv.lock" \
            --body "Monthly uv lock --upgrade. Close and reopen this pull request to run CI."
